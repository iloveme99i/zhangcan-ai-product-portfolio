<rect x="1115" y="610" width="365" height="240" rx="18" fill="#f1f3f6" stroke="#d8d8d5"/><text x="1145" y="655" fill="#687b94" font-size="13">AI 整理建议</text><text x="1145" y="704" fill="#171719" font-size="19" font-weight="700">保持为一条完整记录</text><text x="1145" y="747" fill="#66666d" font-size="14">检测到内容之间有连续语境，</text><text x="1145" y="778" fill="#66666d" font-size="14">不建议拆成多个独立条目。</text><text x="1145" y="820" fill="#687b94" font-size="13">确认整理 →</text></g>
