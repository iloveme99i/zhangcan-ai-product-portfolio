<g font-family="Arial"><rect x="390" y="340" width="690" height="510" rx="18" fill="#fff" stroke="#d8d8d5"/><text x="425" y="390" fill="#77777e" font-size="13">知识 · 3 分钟前</text><text x="425" y="440" fill="#171719" font-size="25" font-weight="700">AI 产品中的信任，不等于给出置信度</text><text x="425" y="486" fill="#67676e" font-size="15">收藏内容被组织成一条完整记录，而不是被拆碎成互不相干的待办和知识点。</text><line x1="425" y1="532" x2="1045" y2="532" stroke="#e2e2df"/><text x="425" y="575" fill="#85858b" font-size="13">正文</text><text x="425" y="617" fill="#242428" font-size="16">真正需要被保留的是判断发生的上下文：</text><text x="425" y="654" fill="#242428" font-size="16">来源是谁、当时的问题是什么、结论能否回看。</text><rect x="425" y="705" width="620" height="94" rx="12" fill="#f5f5f3"/><text x="450" y="743" fill="#74747b" font-size="13">原始来源</text><text x="450" y="775" fill="#26262a" font-size="14">产品设计文章 · 保存于 2026/08/16</text>
